<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Toy Pad Remote</title>
<style>
:root {
  --bg: #0b1020;
  --bg-raised: #131a30;
  --bg-sunken: #080c18;
  --line: #222b47;
  --text: #e8ecf8;
  --muted: #8b94b3;
  --accent: #ffcf3f;
  --accent-ink: #1a1400;
  --danger: #ff5d6c;
  --ok: #3ddc97;
  --radius: 14px;
  --slot: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; }

/* ---------- layout ---------- */
.app { max-width: 1100px; margin: 0 auto; }
.top {
  position: sticky; top: 0; z-index: 5;
  background: linear-gradient(var(--bg) 85%, transparent);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 12px;
}
.bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bar h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
.conn { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn.ok .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.conn.bad .dot { background: var(--danger); }
.banner {
  display: none; margin: 0 0 10px; padding: 8px 12px; border-radius: 10px;
  background: #3a2a05; color: #ffd98a; font-size: 13px;
}
.banner.show { display: block; }

/* ---------- toy pad ---------- */
.pad {
  position: relative;
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center;
  padding: 12px; border-radius: 22px;
  background: radial-gradient(120% 140% at 50% 0%, #1b2442 0%, #0f1530 60%, #0a0f22 100%);
  border: 1px solid var(--line);
  box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
}
.zone {
  --glow: transparent;
  position: relative; border-radius: 16px; padding: 8px;
  background: var(--bg-sunken);
  border: 2px solid color-mix(in srgb, var(--glow) 70%, var(--line));
  box-shadow: 0 0 22px -4px var(--glow), inset 0 0 18px -8px var(--glow);
  transition: border-color .35s, box-shadow .35s;
}
.zone.flash { animation: flash .5s steps(2, jump-none) infinite; }
@keyframes flash { 50% { box-shadow: none; border-color: var(--line); } }
.zone.side { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.zone.side .slot:first-child { grid-column: 1 / -1; justify-self: center; width: calc(50% - 3px); }
.zone.center { border-radius: 50%; padding: 10px; }
.zone.center .slot { border-radius: 50%; width: calc(var(--slot) + 16px); height: calc(var(--slot) + 16px); }
.zone-label {
  position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%);
  font-size: 10px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  background: #0f1530; padding: 0 6px; border-radius: 6px; white-space: nowrap;
}

.slot {
  position: relative; height: var(--slot); min-width: 0;
  border-radius: 12px; border: 1.5px dashed #2c3658;
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 4px 6px; font-size: 11.5px; line-height: 1.15; color: var(--muted);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation;
  transition: background .15s, border-color .15s, transform .15s;
}
.slot .name { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: break-word; }
.slot.filled {
  border: 1.5px solid #3a4775; color: var(--text); font-weight: 600;
  background: linear-gradient(180deg, #24305a, #19213f);
  cursor: grab;
}
.slot .x {
  position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%;
  background: #2b3458; border: 1px solid #44507e; color: var(--text);
  display: none; align-items: center; justify-content: center; font-size: 13px; line-height: 1;
}
.slot.filled .x { display: flex; }
.zone.center .slot .x { top: 0; right: 0; }
.slot.lifted { opacity: .35; }
.slot.busy::after {
  content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid var(--accent); border-right-color: transparent; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.slot.target { border-color: var(--accent); border-style: solid; background: rgba(255,207,63,.12); color: var(--accent); }
.slot.over { transform: scale(1.06); background: rgba(255,207,63,.25); }
.placing .slot { border-color: rgba(255,207,63,.6); }
.placing .slot:not(.filled)::before { content: "+"; color: var(--accent); font-size: 26px; font-weight: 300; line-height: 1; }
.placing .slot:not(.filled) .name { display: none; }

.lift-off {
  position: absolute; inset: auto 12px -14px 12px; transform: translateY(100%);
  padding: 12px; border-radius: 12px; text-align: center; font-weight: 600;
  border: 2px dashed var(--danger); color: var(--danger); background: rgba(40,8,14,.92);
  opacity: 0; pointer-events: none; transition: opacity .15s;
}
.dragging-slot .lift-off { opacity: 1; pointer-events: auto; }
.lift-off.over { background: var(--danger); color: #fff; }

.selected-hint {
  display: none; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 10px;
  border-radius: 10px; background: rgba(255,207,63,.12); color: var(--accent); font-size: 13px;
}
.selected-hint.show { display: flex; }
.selected-hint b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selected-hint button { margin-left: auto; padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,.08); color: var(--text); }

/* ---------- browser ---------- */
.browser { padding: 6px 16px calc(env(safe-area-inset-bottom) + 24px); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: 14px; margin: 6px 0 10px; }
.crumbs button { padding: 4px 6px; border-radius: 6px; color: var(--muted); }
.crumbs button:last-child { color: var(--text); font-weight: 600; }
.crumbs span { color: #4a5478; }
.tools { display: flex; gap: 8px; margin-bottom: 10px; }
.search {
  flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px;
  background: var(--bg-raised); border: 1px solid var(--line); color: var(--text); outline: none;
}
.search:focus { border-color: #45518a; }
.iconbtn { width: 42px; border-radius: 10px; background: var(--bg-raised); border: 1px solid var(--line); font-size: 17px; }

.favs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
.favs::-webkit-scrollbar { display: none; }
.favs:empty { display: none; }
.chip {
  flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px;
  background: var(--bg-raised); border: 1px solid var(--line); font-size: 13px; font-weight: 600;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-x;
}
.chip::before { content: "★"; color: var(--accent); }

.list { list-style: none; margin: 0; padding: 0; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--bg-raised); }
.row {
  display: flex; align-items: center; gap: 12px; padding: 0 6px 0 14px; min-height: 52px;
  border-top: 1px solid var(--line);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y;
}
.row:first-child { border-top: 0; }
.row .ic { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 15px; background: #1d2645; }
.row.dir .ic { background: #2a2a12; }
.row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.file { cursor: grab; }
.row.sel { background: rgba(255,207,63,.12); }
.row.sel .label { color: var(--accent); font-weight: 600; }
.row .star { flex: none; width: 44px; height: 44px; font-size: 18px; color: #4a5478; }
.row .star.on { color: var(--accent); }
.row .chev { flex: none; width: 30px; color: var(--muted); text-align: center; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* ---------- drag ghost + toast ---------- */
.ghost {
  position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none;
  padding: 10px 14px; border-radius: 12px; font-weight: 700; font-size: 14px;
  background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 12px 28px rgba(0,0,0,.5); max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transform: translate(-50%, -130%) scale(1.04);
}
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); z-index: 60;
  transform: translate(-50%, 20px); opacity: 0; transition: .2s;
  padding: 10px 16px; border-radius: 12px; background: #222b47; color: var(--text);
  box-shadow: 0 10px 30px rgba(0,0,0,.5); font-size: 14px; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: #4a1520; }
body.dragging, body.dragging * { cursor: grabbing !important; }

/* Wide screens: toy pad on the left, browser on the right. */
@media (min-width: 860px) {
  :root { --slot: 78px; }
  .app { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(320px, 420px); gap: 8px; align-items: start; }
  .top { padding-top: 22px; }
  .browser { padding-top: 22px; position: sticky; top: 0; max-height: 100vh; overflow-y: auto; }
}
/* Phones: each side pad becomes a column of three wider spaces, so names fit. */
@media (max-width: 599px) {
  .pad { gap: 8px; padding: 10px; }
  .zone { padding: 6px; }
  .zone.side { grid-template-columns: 1fr; gap: 5px; }
  .zone.side .slot { height: 46px; }
  .zone.side .slot:first-child { grid-column: auto; justify-self: stretch; width: auto; }
  .slot .name { -webkit-line-clamp: 2; }
  .zone.center .slot { width: 78px; height: 78px; }
}
@media (max-width: 360px) {
  .zone.center .slot { width: 64px; height: 64px; }
  .slot { font-size: 11px; }
}
</style>
</head>
<body>
<div class="app">
  <section class="top" id="top">
    <div class="bar">
      <h1>Toy Pad Remote</h1>
      <div class="conn" id="conn"><span class="dot"></span><span id="connText">Connecting…</span></div>
    </div>
    <div class="banner" id="banner"></div>

    <div class="pad" id="pad">
      <div class="zone side" data-zone="left">
        <div class="slot" data-slot="0"></div>
        <div class="slot" data-slot="3"></div>
        <div class="slot" data-slot="4"></div>
        <span class="zone-label">Left</span>
      </div>
      <div class="zone center" data-zone="top">
        <div class="slot" data-slot="1"></div>
        <span class="zone-label">Centre</span>
      </div>
      <div class="zone side" data-zone="right">
        <div class="slot" data-slot="2"></div>
        <div class="slot" data-slot="5"></div>
        <div class="slot" data-slot="6"></div>
        <span class="zone-label">Right</span>
      </div>
      <div class="lift-off" data-drop="remove">Drop here to lift off the pad</div>
    </div>

    <div class="selected-hint" id="selHint">
      <span>Placing</span><b id="selName"></b><button id="selCancel" type="button">Cancel</button>
    </div>
  </section>

  <section class="browser">
    <nav class="crumbs" id="crumbs" aria-label="Folder"></nav>
    <div class="tools">
      <input class="search" id="search" type="search" placeholder="Filter this folder" autocomplete="off" spellcheck="false">
      <button class="iconbtn" id="refresh" type="button" aria-label="Reload folder">↻</button>
    </div>
    <div class="favs" id="favs"></div>
    <ul class="list" id="list"><li class="empty">Loading…</li></ul>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  // ---------------- helpers ----------------
  const $ = (id) => document.getElementById(id);
  const store = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
  };
  const displayName = (file) => file.replace(/\/$/, "").replace(/\.(bin|dump|nfc)$/i, "");
  const isFigureFile = (name) => !name.endsWith("/");

  let toastTimer = 0;
  function toast(text, isError) {
    const el = $("toast");
    el.textContent = text;
    el.className = "toast show" + (isError ? " err" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (el.className = "toast" + (isError ? " err" : "")), isError ? 3200 : 1800);
  }

  async function api(path, body) {
    const opts = body === undefined ? {} : {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    };
    const res = await fetch(path, opts);
    let data = null;
    try { data = await res.json(); } catch {}
    if (!res.ok) {
      const err = new Error((data && (data.error || data.message)) || ("HTTP " + res.status));
      err.code = data && data.error;
      throw err;
    }
    return data;
  }

  const errorText = {
    COULD_NOT_READ_FILE: "That file isn't a Dimensions figure dump",
    INVALID_FILE: "That file path isn't allowed",
    NO_FIGURE_IN_SLOT: "That space is already empty",
    NO_FIGURE_IN_OLD_SLOT: "That figure isn't on the pad any more",
  };
  const explain = (e) => errorText[e.code] || e.message || "Something went wrong";

  // ---------------- state ----------------
  let slots = Array(7).fill(null);            // {id, name} | null
  let busySlots = new Set();
  let cwd = store.get("rensyshid.cwd", "");
  let entries = [];
  let favs = store.get("rensyshid.favs", []);  // relative file paths
  let selected = null;                         // relative path chosen by tap, waiting for a slot

  // ---------------- toy pad ----------------
  const slotEls = [...document.querySelectorAll(".slot")].sort((a, b) => a.dataset.slot - b.dataset.slot);

  function renderSlots() {
    for (const el of slotEls) {
      const i = +el.dataset.slot;
      const fig = slots[i];
      el.classList.toggle("filled", !!fig);
      el.classList.toggle("busy", busySlots.has(i));
      el.innerHTML = "";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = fig ? fig.name : "";
      el.appendChild(name);
      const x = document.createElement("button");
      x.className = "x"; x.type = "button"; x.textContent = "✕";
      x.setAttribute("aria-label", "Lift off " + (fig ? fig.name : "figure"));
      x.dataset.remove = i;
      el.appendChild(x);
      el.setAttribute("aria-label", fig ? fig.name + " on the pad" : "Empty space");
    }
  }

  function renderColors(colors) {
    if (!colors) return;
    for (const zone of document.querySelectorAll(".zone")) {
      const c = colors[zone.dataset.zone];
      const on = c && c.type !== "none" && (c.red || c.green || c.blue);
      zone.style.setProperty("--glow", on ? `rgb(${c.red},${c.green},${c.blue})` : "transparent");
      zone.classList.toggle("flash", !!on && c.type === "flash");
    }
  }

  // ---------------- connection + polling ----------------
  let online = null;
  function setOnline(ok) {
    if (online === ok) return;
    online = ok;
    $("conn").className = "conn " + (ok ? "ok" : "bad");
    $("connText").textContent = ok ? "Connected" : "Wii U not reachable";
  }

  async function refreshState() {
    try {
      const s = await api("/device/dimensions/state");
      const next = Array(7).fill(null);
      for (let i = 0; i < 7; i++) {
        const f = s.slots[String(i)];
        if (f && f.name !== "None") next[i] = { id: f.id, name: f.name };
      }
      slots = next;
      renderSlots();
      renderColors(s.colors);
      setOnline(true);
    } catch {
      setOnline(false);
    }
  }

  async function refreshStatus() {
    try {
      const s = await api("/status");
      const banner = $("banner");
      let msg = "";
      if (s.status !== 1) msg = "Emulation is turned off. Turn it on in the re_nsyshid menu (L + Down + SELECT) before starting the game.";
      else if (s.device !== 3) msg = "re_nsyshid isn't set to emulate the Dimensions Toy Pad. Change \"Device to Emulate\" in the plugin menu.";
      banner.textContent = msg;
      banner.classList.toggle("show", !!msg);
    } catch {}
  }

  let pollTimer = 0;
  function schedulePoll() {
    clearTimeout(pollTimer);
    if (document.hidden) return;
    pollTimer = setTimeout(async () => { await refreshState(); schedulePoll(); }, 1000);
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { refreshState(); refreshStatus(); }
    schedulePoll();
  });

  // ---------------- toy pad actions ----------------
  async function withBusy(indices, fn) {
    indices.forEach((i) => busySlots.add(i));
    renderSlots();
    try { return await fn(); }
    finally { indices.forEach((i) => busySlots.delete(i)); await refreshState(); }
  }

  async function placeFile(path, slot) {
    await withBusy([slot], async () => {
      try {
        const r = await api("/device/dimensions/load", { file: path, slot });
        toast((r && r.name) ? r.name + " placed" : "Placed");
      } catch (e) { toast(explain(e), true); }
    });
  }

  async function moveFigure(from, to) {
    if (from === to) return;
    await withBusy([from, to], async () => {
      try { await api("/device/dimensions/move", { oldSlot: from, newSlot: to }); }
      catch (e) { toast(explain(e), true); }
    });
  }

  async function removeFigure(slot) {
    const name = slots[slot] && slots[slot].name;
    await withBusy([slot], async () => {
      try { await api("/device/dimensions/remove", { slot }); toast((name || "Figure") + " lifted off"); }
      catch (e) { toast(explain(e), true); }
    });
  }

  // ---------------- tap-to-place ----------------
  function select(path) {
    selected = selected === path ? null : path;
    $("pad").classList.toggle("placing", !!selected);
    $("selHint").classList.toggle("show", !!selected);
    $("selName").textContent = selected ? displayName(selected.split("/").pop()) : "";
    renderList();
  }
  $("selCancel").addEventListener("click", () => select(null));

  // ---------------- browser ----------------
  async function openFolder(path) {
    cwd = path;
    store.set("rensyshid.cwd", cwd);
    $("search").value = "";
    renderCrumbs();
    $("list").innerHTML = '<li class="empty">Loading…</li>';
    try {
      const r = await api("/files?path=" + encodeURIComponent(cwd));
      entries = r.files || [];
    } catch (e) {
      entries = [];
      if (cwd) { return openFolder(""); }  // the remembered folder is gone
      $("list").innerHTML = '<li class="empty">Couldn\'t read SD:/wiiu/re_nsyshid/</li>';
      return;
    }
    renderList();
  }

  function renderCrumbs() {
    const nav = $("crumbs");
    nav.innerHTML = "";
    const parts = cwd.split("/").filter(Boolean);
    const add = (label, path) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label;
      b.addEventListener("click", () => openFolder(path));
      nav.appendChild(b);
    };
    add("re_nsyshid", "");
    parts.forEach((p, i) => {
      const sep = document.createElement("span"); sep.textContent = "›"; nav.appendChild(sep);
      add(p, parts.slice(0, i + 1).join("/") + "/");
    });
  }

  function renderList() {
    const q = $("search").value.trim().toLowerCase();
    const list = $("list");
    list.innerHTML = "";
    const shown = entries.filter((e) => !q || displayName(e).toLowerCase().includes(q));
    if (cwd) {
      const up = cwd.split("/").filter(Boolean).slice(0, -1).join("/");
      list.appendChild(makeRow("../", up ? up + "/" : "", true, "Back"));
    }
    for (const e of shown) {
      const isDir = e.endsWith("/");
      list.appendChild(makeRow(e, isDir ? cwd + e : cwd + e, isDir));
    }
    if (!shown.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = q ? "No matches in this folder" : "This folder is empty";
      list.appendChild(li);
    }
    renderFavs();
  }

  function makeRow(name, path, isDir, labelOverride) {
    const li = document.createElement("li");
    li.className = "row " + (isDir ? "dir" : "file") + (!isDir && selected === path ? " sel" : "");
    li.dataset.path = path;
    li.dataset.kind = isDir ? "dir" : "file";
    const ic = document.createElement("span"); ic.className = "ic"; ic.textContent = isDir ? (labelOverride ? "↩" : "📁") : "🧱";
    const label = document.createElement("span"); label.className = "label"; label.textContent = labelOverride || displayName(name);
    li.append(ic, label);
    if (isDir) {
      const chev = document.createElement("span"); chev.className = "chev"; chev.textContent = labelOverride ? "" : "›";
      li.appendChild(chev);
    } else {
      const star = document.createElement("button");
      star.type = "button";
      star.className = "star" + (favs.includes(path) ? " on" : "");
      star.textContent = favs.includes(path) ? "★" : "☆";
      star.dataset.fav = path;
      star.setAttribute("aria-label", "Favourite " + displayName(name));
      li.appendChild(star);
    }
    return li;
  }

  function renderFavs() {
    const box = $("favs");
    box.innerHTML = "";
    for (const path of favs) {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.dataset.path = path;
      chip.dataset.kind = "file";
      chip.textContent = displayName(path.split("/").pop());
      box.appendChild(chip);
    }
  }

  function toggleFav(path) {
    favs = favs.includes(path) ? favs.filter((p) => p !== path) : [...favs, path];
    store.set("rensyshid.favs", favs);
    renderList();
  }

  $("search").addEventListener("input", renderList);
  $("refresh").addEventListener("click", () => openFolder(cwd));

  // ---------------- drag and drop (mouse + touch) ----------------
  // Mouse: drag starts after a few pixels. Touch: press and hold briefly, then
  // drag, so ordinary swipes still scroll the folder list.
  const HOLD_MS = 220, MOUSE_SLOP = 6, TOUCH_SLOP = 10;
  let press = null;   // pending gesture
  let drag = null;    // active drag: {kind: "file"|"slot", path?, slot?, ghost}

  function sourceFrom(target) {
    const slotEl = target.closest(".slot.filled");
    if (slotEl && !target.closest(".x")) return { kind: "slot", slot: +slotEl.dataset.slot, el: slotEl, label: slots[+slotEl.dataset.slot]?.name || "Figure" };
    const item = target.closest('[data-kind="file"]');
    if (item && !target.closest(".star")) return { kind: "file", path: item.dataset.path, el: item, label: item.textContent.replace(/[★☆🧱]/g, "").trim() };
    return null;
  }

  function dropTargetAt(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const slot = el.closest(".slot");
    if (slot) return { slot: +slot.dataset.slot, el: slot };
    const off = el.closest('[data-drop="remove"]');
    if (off && drag && drag.kind === "slot") return { remove: true, el: off };
    return null;
  }

  let overEl = null;
  function setOver(el) {
    if (overEl === el) return;
    if (overEl) overEl.classList.remove("over");
    overEl = el;
    if (overEl) overEl.classList.add("over");
  }

  function beginDrag(src, x, y) {
    drag = src;
    const g = document.createElement("div");
    g.className = "ghost";
    g.textContent = src.label;
    document.body.appendChild(g);
    drag.ghost = g;
    document.body.classList.add("dragging");
    if (src.kind === "slot") { src.el.classList.add("lifted"); $("pad").classList.add("dragging-slot"); }
    slotEls.forEach((s) => s.classList.add("target"));
    if (navigator.vibrate) navigator.vibrate(12);
    moveDrag(x, y);
  }

  function moveDrag(x, y) {
    drag.ghost.style.left = x + "px";
    drag.ghost.style.top = y + "px";
    const t = dropTargetAt(x, y);
    setOver(t ? t.el : null);
  }

  function endDrag(x, y, cancelled) {
    // Find the target while the drop zones are still showing.
    const t = cancelled ? null : dropTargetAt(x, y);
    const d = drag;
    drag = null;
    d.ghost.remove();
    document.body.classList.remove("dragging");
    $("pad").classList.remove("dragging-slot");
    slotEls.forEach((s) => s.classList.remove("target", "lifted"));
    setOver(null);
    if (!t) return;
    if (d.kind === "file" && t.slot !== undefined) placeFile(d.path, t.slot);
    else if (d.kind === "slot" && t.remove) removeFigure(d.slot);
    else if (d.kind === "slot" && t.slot !== undefined) moveFigure(d.slot, t.slot);
  }

  document.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0 || drag) return;
    const src = sourceFrom(ev.target);
    if (!src) return;
    press = { src, id: ev.pointerId, x: ev.clientX, y: ev.clientY, touch: ev.pointerType !== "mouse", timer: 0 };
    if (press.touch) {
      press.timer = setTimeout(() => { if (press) { beginDrag(press.src, press.x, press.y); press.started = true; } }, HOLD_MS);
    }
  });

  document.addEventListener("pointermove", (ev) => {
    if (drag && (!press || ev.pointerId === press.id)) { ev.preventDefault(); moveDrag(ev.clientX, ev.clientY); return; }
    if (!press || ev.pointerId !== press.id) return;
    const dist = Math.hypot(ev.clientX - press.x, ev.clientY - press.y);
    if (press.touch) {
      if (dist > TOUCH_SLOP) { clearTimeout(press.timer); press = null; }  // it's a scroll
      else { press.x = ev.clientX; press.y = ev.clientY; }
    } else if (dist > MOUSE_SLOP) {
      beginDrag(press.src, ev.clientX, ev.clientY);
      press.started = true;
    }
  }, { passive: false });

  function finishPointer(ev, cancelled) {
    if (!press || ev.pointerId !== press.id) {
      if (drag) endDrag(ev.clientX, ev.clientY, cancelled);
      return;
    }
    clearTimeout(press.timer);
    const started = press.started;
    press = null;
    if (drag) { endDrag(ev.clientX, ev.clientY, cancelled); suppressClick = started; }
  }
  document.addEventListener("pointerup", (ev) => finishPointer(ev, false));
  document.addEventListener("pointercancel", (ev) => finishPointer(ev, true));

  // While dragging on a touch screen, stop the page from scrolling underneath.
  document.addEventListener("touchmove", (ev) => { if (drag) ev.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", (ev) => { if (drag || press) ev.preventDefault(); });

  // ---------------- taps ----------------
  let suppressClick = false;
  document.addEventListener("click", (ev) => {
    if (suppressClick) { suppressClick = false; ev.preventDefault(); ev.stopPropagation(); return; }

    const rm = ev.target.closest("[data-remove]");
    if (rm) { removeFigure(+rm.dataset.remove); return; }

    const fav = ev.target.closest("[data-fav]");
    if (fav) { toggleFav(fav.dataset.fav); return; }

    const slotEl = ev.target.closest(".slot");
    if (slotEl) {
      const i = +slotEl.dataset.slot;
      if (selected) { const path = selected; select(null); placeFile(path, i); }
      else if (!slots[i]) toast("Drag a figure here, or tap one in the list first");
      return;
    }

    const row = ev.target.closest("[data-kind]");
    if (!row) return;
    if (row.dataset.kind === "dir") openFolder(row.dataset.path);
    else select(row.dataset.path);
  }, true);

  // ---------------- start ----------------
  renderSlots();
  openFolder(cwd);
  refreshState().then(schedulePoll);
  refreshStatus();
  setInterval(() => { if (!document.hidden) refreshStatus(); }, 10000);
})();
</script>
</body>
</html>
